<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: la app usa las zonas seguras (la barra de arriba y la de abajo del iPad). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- Agregada a la pantalla de inicio del iPad, se abre a pantalla completa, como una app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Las versiones nuevas de iOS dibujan la página detrás de la barra de estado igual: el alto lo corrige el
         script del principio del body y lo de arriba lo salta la app con la zona segura (ui/zonaSegura.web.ts). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <link rel="apple-touch-icon" href="/app/icono.png" />
    <link rel="icon" type="image/png" href="/app/icono.png" />
    <title>Gastos</title>
    <style id="expo-reset">
      html, body { height: 100%; background-color: #0B0E13; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      /* En el iPhone, abierta desde el ícono, iOS le da a la página el alto de la pantalla menos la barra de
         estado, pero la dibuja desde el borde de arriba: toda la app quedaba corrida hacia arriba, con una
         franja vacía abajo. El script del body mide el alto de verdad (--alto); la app y sus ventanas lo usan. */
      html.alto-real #root { position: fixed; top: 0; left: 0; right: 0; height: var(--alto); }
      html.alto-real [aria-modal="true"] { bottom: auto !important; height: var(--alto) !important; }
      /* Es una app de tocar: sin el borde que el navegador le pone a lo que tiene el foco. */
      *:focus, *:focus-visible { outline: none; }
      /* En la computadora, barras de desplazamiento finas y discretas (en el iPhone y el iPad no se ven). */
      * { scrollbar-width: thin; scrollbar-color: rgba(128, 128, 128, 0.35) transparent; }
    </style>
  </head>
  <body>
    <script>
      // El alto de verdad en el iPhone abierto desde el ícono (ver el estilo de arriba). Si iOS da la página
      // más corta que la pantalla y la barra de estado la tapa por arriba, le falta justo ese margen.
      (function () {
        if (!navigator.standalone || !/iPhone|iPod/.test(navigator.userAgent)) return;
        var sonda = document.createElement('div');
        sonda.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
        document.body.appendChild(sonda);
        function medir() {
          var raiz = document.documentElement;
          var vertical = innerHeight >= innerWidth;
          var pantalla = vertical ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          var arriba = parseFloat(getComputedStyle(sonda).paddingTop) || 0;
          var alto = Math.min(pantalla, innerHeight + arriba);
          window.altoReal = pantalla + '/' + innerHeight + '+' + arriba;
          if (alto > innerHeight) {
            raiz.style.setProperty('--alto', alto + 'px');
            raiz.classList.add('alto-real');
          } else {
            raiz.classList.remove('alto-real');
          }
        }
        medir();
        addEventListener('resize', medir);
        addEventListener('orientationchange', function () { setTimeout(medir, 300); });
      })();
    </script>
    <noscript>Hace falta JavaScript para abrir la app.</noscript>
    <div id="root"></div>
    <!-- Si algo falla al abrir, en vez de quedar en negro se ve el error y un botón para recargar. -->
    <div id="falla" style="display:none;position:fixed;inset:0;padding:60px 24px;background:#0B0E13;color:#F5F6F7;font:15px/1.4 system-ui,sans-serif;z-index:9">
      <p style="font-size:20px;font-weight:600;margin:0 0 8px">No terminó de abrir</p>
      <p id="falla-texto" style="color:rgba(245,246,247,.6);margin:0 0 20px;word-break:break-word"></p>
      <button onclick="location.reload()" style="font:600 17px system-ui;padding:14px 22px;border:0;border-radius:14px;background:#F5F6F7;color:#0B0E13">Recargar</button>
    </div>
    <script>
      (function () {
        var errores = [];
        function mostrar(texto) {
          document.getElementById('falla-texto').textContent = texto;
          document.getElementById('falla').style.display = 'block';
        }
        window.addEventListener('error', function (e) { errores.push(e.message || String(e)); });
        window.addEventListener('unhandledrejection', function (e) { errores.push(String(e.reason && e.reason.message || e.reason)); });
        // A los 20 segundos sin nada dibujado, se muestra qué pasó.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.innerText.trim() === '') mostrar(errores.length ? errores.join(' · ') : 'Se quedó cargando: revisa que Tailscale esté prendido.');
        }, 20000);
        // Cuánto tardó en abrir (ms desde que el navegador empezó): se le cuenta a la PC, que lo anota en su registro.
        var observador = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (!root || root.innerText.trim() === '') return;
          observador.disconnect();
          var n = performance.getEntriesByType('navigation')[0] || {};
          var js = performance.getEntriesByType('resource').filter(function (r) { return /entry-/.test(r.name); })[0];
          var tiempos = {
            pagina: Math.round(n.responseEnd || 0), codigo: js ? Math.round(js.responseEnd) : 'en caché',
            dibujo: Math.round(performance.now()), desde_icono: !!navigator.standalone,
            alto: window.altoReal || 'sin medir', // pantalla/alto que dio iOS+margen de arriba
          };
          if (navigator.sendBeacon) navigator.sendBeacon('/app/arranque', JSON.stringify(tiempos));
        });
        observador.observe(document.getElementById('root'), { childList: true, subtree: true, characterData: true });
      })();
    </script>
  </body>
</html>
