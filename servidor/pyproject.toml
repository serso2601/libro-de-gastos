[project]
name = "servidor-libro-de-gastos"
version = "0.1.0"
description = "Servidor local del Libro de Gastos: guarda cuentas, movimientos y recurrencias en la PC"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gastos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
