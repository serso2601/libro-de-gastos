<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const PALETTE = ["#3DA5F5", "#34D8A6", "#F16565", "#F5B942", "#A78BFA", "#F472B6", "#4ADE80", "#38BDF8", "#FB923C", "#94A3B8"];

const COLORS = {
  paper: "#0B0E13",
  card: "#171B22",
  cardAlt: "#20252E",
  ink: "#F5F6F7",
  inkMuted: "rgba(245,246,247,0.5)",
  rule: "rgba(245,246,247,0.08)",
  ruleStrong: "rgba(245,246,247,0.14)",
  good: "#34D8A6",
  alert: "#F16565",
  gold: "#3B82F6",
  goldBright: "#60A5FA",
  goldInk: "#FFFFFF",
};

const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MONTH_SHORT = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function pad(n) { return String(n).padStart(2, "0"); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function formatMoney(n, currency) {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  return `${sign}${currency}${abs.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function formatDayLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const weekday = dt.toLocaleDateString("es-ES", { weekday: "long" });
  return `${d} de ${MONTH_NAMES[m - 1].slice(0, 3)}, ${weekday}`;
}

function addPeriod(dateStr, freq, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  if (freq === "weekly") {
    const dt = new Date(y, m - 1, d + 7 * n);
    return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  }
  const dt = new Date(y, m - 1 + n, d);
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
}

function accountBalance(accountId, accounts, transactions) {
  const acc = accounts.find((a) => a.id === accountId);
  let bal = acc ? acc.initialBalance : 0;
  for (const t of transactions) {
    if (t.kind === "income" && t.accountId === accountId) bal += t.amount;
    else if (t.kind === "expense" && t.accountId === accountId) bal -= t.amount;
    else if (t.kind === "transfer") {
      if (t.fromAccountId === accountId) bal -= t.amount;
      if (t.toAccountId === accountId) bal += t.amount;
    }
  }
  return bal;
}

/* ---------------- icons (no external icon library needed) ---------------- */

function Icon({ name, size = 18, style = {} }) {
  const color = style.color || "currentColor";
  const wrap = { width: size, height: size, flexShrink: 0, ...style };
  const svgProps = { viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style: wrap };
  switch (name) {
    case "plus": return <svg {...svgProps}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "x": return <svg {...svgProps}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "chevron-left": return <svg {...svgProps}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevron-right": return <svg {...svgProps}><polyline points="9 18 15 12 9 6" /></svg>;
    case "chevron-up": return <svg {...svgProps}><polyline points="18 15 12 9 6 15" /></svg>;
    case "chevron-down": return <svg {...svgProps}><polyline points="6 9 12 15 18 9" /></svg>;
    case "trash": return <span style={{ fontSize: size, lineHeight: 1, ...style }}>🗑️</span>;
    case "pencil": return <span style={{ fontSize: size, lineHeight: 1, ...style }}>✏️</span>;
    case "settings": return <span style={{ fontSize: size * 1.05, lineHeight: 1, ...style }}>⚙️</span>;
    case "alert": return <span style={{ fontSize: size, lineHeight: 1, ...style }}>⚠️</span>;
    case "repeat": return <span style={{ fontSize: size * 0.9, lineHeight: 1, ...style }}>🔁</span>;
    case "transfer": return <span style={{ fontSize: size, lineHeight: 1, ...style }}>⇄</span>;
    case "home": return <span style={{ fontSize: size * 1.05, lineHeight: 1, ...style }}>🏠</span>;
    case "wallet": return <span style={{ fontSize: size * 1.05, lineHeight: 1, ...style }}>👛</span>;
    case "piggy": return <span style={{ fontSize: size * 1.05, lineHeight: 1, ...style }}>🐷</span>;
    case "list": return <span style={{ fontSize: size * 1.05, lineHeight: 1, ...style }}>📋</span>;
    case "pie": return <span style={{ fontSize: size * 1.05, lineHeight: 1, ...style }}>📊</span>;
    default: return null;
  }
}

/* ---------------- charts (Chart.js instead of recharts) ---------------- */

function DonutChart({ data, currency }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "doughnut",
      data: {
        labels: data.map((c) => c.name),
        datasets: [{ data: data.map((c) => c.total), backgroundColor: data.map((c) => c.color), borderColor: COLORS.card, borderWidth: 2 }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: "60%",
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${formatMoney(ctx.parsed, currency)}` } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data, currency]);
  return <div style={{ width: "100%", height: 180 }}><canvas ref={canvasRef} /></div>;
}

function GroupedBarChart({ data, currency }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels: data.map((m) => m.label),
        datasets: [
          { label: "Ingresos", data: data.map((m) => m.ingresos), backgroundColor: COLORS.good, borderRadius: 4 },
          { label: "Gastos", data: data.map((m) => m.gastos), backgroundColor: COLORS.alert, borderRadius: 4 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${formatMoney(ctx.parsed.y, currency)}` } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: COLORS.inkMuted, font: { size: 11 } } },
          y: { ticks: { color: COLORS.inkMuted, font: { size: 10 } }, grid: { color: COLORS.rule } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data, currency]);
  return <div style={{ width: "100%", height: 160 }}><canvas ref={canvasRef} /></div>;
}

/* ---------------- shared UI ---------------- */

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(10,8,5,0.6)" }} onClick={onClose}>
      <div className="w-full sm:max-w-md sm:rounded-3xl p-5 overflow-y-auto" style={{ background: COLORS.card, maxHeight: "88vh", borderTop: `1px solid ${COLORS.ruleStrong}` }} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-center gap-1 mb-4 sm:hidden">
          <span style={{ width: 32, height: 3, borderRadius: 999, background: COLORS.ruleStrong }} />
        </div>
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display text-lg" style={{ color: COLORS.ink }}>{title}</h2>
          <button onClick={onClose} aria-label="Cerrar" className="p-1"><Icon name="x" size={20} style={{ color: COLORS.inkMuted }} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

const TABS = [
  { id: "resumen", label: "Resumen", icon: "home" },
  { id: "cuentas", label: "Cuentas", icon: "wallet" },
  { id: "presupuesto", label: "Presupuesto", icon: "piggy" },
  { id: "transacciones", label: "Movimientos", icon: "list" },
  { id: "graficos", label: "Gráficos", icon: "pie" },
];

function BottomNav({ active, onChange }) {
  return (
    <div className="fixed bottom-0 left-0 right-0 z-30" style={{ background: COLORS.card, borderTop: `1px solid ${COLORS.rule}` }}>
      <div className="max-w-md mx-auto grid grid-cols-5">
        {TABS.map((t) => {
          const isActive = active === t.id;
          const color = isActive ? COLORS.gold : COLORS.inkMuted;
          return (
            <button key={t.id} onClick={() => onChange(t.id)} className="flex flex-col items-center gap-1 py-2.5">
              <Icon name={t.icon} size={19} style={{ color }} />
              <span style={{ fontSize: 10, color, fontWeight: isActive ? 600 : 400 }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function QuickActionSheet({ onClose, onPick }) {
  const options = [
    { id: "expense", label: "Gasto", emoji: "➖" },
    { id: "income", label: "Ingreso", emoji: "➕" },
    { id: "transfer", label: "Transferencia", emoji: "⇄" },
  ];
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(10,8,5,0.6)" }} onClick={onClose}>
      <div className="w-full sm:max-w-md rounded-t-3xl p-5" style={{ background: COLORS.card, borderTop: `1px solid ${COLORS.ruleStrong}` }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display text-lg" style={{ color: COLORS.ink }}>¿Qué querés registrar?</h2>
          <button onClick={onClose}><Icon name="x" size={20} style={{ color: COLORS.inkMuted }} /></button>
        </div>
        <div className="space-y-2">
          {options.map((o) => (
            <button key={o.id} onClick={() => onPick(o.id)} className="w-full flex items-center gap-3 rounded-xl px-4 py-3" style={{ border: `1px solid ${COLORS.rule}` }}>
              <span className="text-xl">{o.emoji}</span>
              <span className="text-sm font-medium" style={{ color: COLORS.ink }}>{o.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function TransactionRow({ tx, accounts, categories, currency, onClick }) {
  const accountName = (id) => (accounts.find((a) => a.id === id) || {}).name || "?";
  if (tx.kind === "transfer") {
    return (
      <button onClick={onClick} className="w-full flex items-center gap-3 text-left py-2">
        <span className="rounded-xl flex items-center justify-center shrink-0" style={{ width: 40, height: 40, background: "rgba(59,130,246,0.15)" }}>
          <Icon name="transfer" size={16} style={{ color: COLORS.gold }} />
        </span>
        <div className="flex-1 min-w-0">
          <p className="text-sm truncate font-medium" style={{ color: COLORS.ink }}>{tx.note || "Transferencia"}</p>
          <p className="text-xs truncate" style={{ color: COLORS.inkMuted }}>{accountName(tx.fromAccountId)} → {accountName(tx.toAccountId)}</p>
        </div>
        <span className="font-mono text-sm font-semibold" style={{ color: COLORS.gold }}>{formatMoney(tx.amount, currency)}</span>
      </button>
    );
  }
  const cat = categories.find((c) => c.id === tx.categoryId) || { emoji: "💰", color: COLORS.inkMuted, name: "Sin categoría" };
  const isIncome = tx.kind === "income";
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 text-left py-2">
      <span className="rounded-xl flex items-center justify-center shrink-0" style={{ width: 40, height: 40, background: `${cat.color}26` }}>
        <span className="text-base">{cat.emoji}</span>
      </span>
      <div className="flex-1 min-w-0">
        <p className="text-sm truncate font-medium flex items-center gap-1" style={{ color: COLORS.ink }}>
          {tx.note || cat.name}
          {tx.recurrence && <Icon name="repeat" size={11} style={{ color: COLORS.inkMuted }} />}
        </p>
        <p className="text-xs truncate" style={{ color: COLORS.inkMuted }}>{accountName(tx.accountId)} · {cat.name}</p>
      </div>
      <span className="font-mono text-sm font-semibold" style={{ color: isIncome ? COLORS.good : COLORS.alert }}>{isIncome ? "+" : "−"}{formatMoney(tx.amount, currency)}</span>
    </button>
  );
}

/* ---------------- tabs ---------------- */

function TabResumen({ accounts, transactions, categories, currency, viewYear, viewMonth, onPrevMonth, onNextMonth, onEditTransaction, onGoTo }) {
  const monthKey = `${viewYear}-${pad(viewMonth)}`;
  const totalBalance = accounts.reduce((s, a) => s + accountBalance(a.id, accounts, transactions), 0);
  const monthTx = transactions.filter((t) => t.date.slice(0, 7) === monthKey && t.kind !== "transfer");
  const income = monthTx.filter((t) => t.kind === "income").reduce((s, t) => s + t.amount, 0);
  const expense = monthTx.filter((t) => t.kind === "expense").reduce((s, t) => s + t.amount, 0);
  const net = income - expense;
  const recent = transactions.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).slice(0, 5);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <button onClick={onPrevMonth} className="p-2 rounded-full" style={{ background: COLORS.card }} aria-label="Mes anterior"><Icon name="chevron-left" size={16} style={{ color: COLORS.inkMuted }} /></button>
        <span className="text-sm font-medium capitalize" style={{ color: COLORS.ink }}>{MONTH_NAMES[viewMonth - 1]} {viewYear}</span>
        <button onClick={onNextMonth} className="p-2 rounded-full" style={{ background: COLORS.card }} aria-label="Mes siguiente"><Icon name="chevron-right" size={16} style={{ color: COLORS.inkMuted }} /></button>
      </div>

      <div className="rounded-2xl p-5 mb-4" style={{ background: COLORS.card }}>
        <p className="text-sm font-semibold mb-1" style={{ color: COLORS.ink }}>Balance total</p>
        <p className="font-mono font-bold" style={{ fontSize: 34, color: totalBalance < 0 ? COLORS.alert : COLORS.good }}>{formatMoney(totalBalance, currency)}</p>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.card }}>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm font-semibold" style={{ color: COLORS.ink }}>Este mes</span>
          <span className="font-mono text-xs font-semibold" style={{ color: net >= 0 ? COLORS.good : COLORS.alert }}>Neto {net >= 0 ? "+" : "−"}{formatMoney(Math.abs(net), currency)}</span>
        </div>
        <div className="flex gap-3">
          <div className="flex-1 flex items-center gap-2.5 rounded-xl p-3" style={{ background: COLORS.cardAlt }}>
            <span className="rounded-lg flex items-center justify-center shrink-0" style={{ width: 34, height: 34, background: "rgba(241,101,101,0.15)" }}>
              <Icon name="chevron-down" size={16} style={{ color: COLORS.alert }} />
            </span>
            <div className="min-w-0">
              <p className="text-xs" style={{ color: COLORS.inkMuted }}>Gastos</p>
              <p className="font-mono text-sm font-semibold" style={{ color: COLORS.alert }}>−{formatMoney(expense, currency)}</p>
            </div>
          </div>
          <div className="flex-1 flex items-center gap-2.5 rounded-xl p-3" style={{ background: COLORS.cardAlt }}>
            <span className="rounded-lg flex items-center justify-center shrink-0" style={{ width: 34, height: 34, background: "rgba(52,216,166,0.15)" }}>
              <Icon name="chevron-up" size={16} style={{ color: COLORS.good }} />
            </span>
            <div className="min-w-0">
              <p className="text-xs" style={{ color: COLORS.inkMuted }}>Ingresos</p>
              <p className="font-mono text-sm font-semibold" style={{ color: COLORS.good }}>+{formatMoney(income, currency)}</p>
            </div>
          </div>
        </div>
      </div>

      <div className="rounded-2xl p-4" style={{ background: COLORS.card }}>
        <div className="flex items-center justify-between mb-3">
          <p className="text-sm font-semibold" style={{ color: COLORS.ink }}>Últimos movimientos</p>
          <button onClick={() => onGoTo("transacciones")} style={{ fontSize: 12, fontWeight: 600, color: COLORS.gold }}>Ver todo</button>
        </div>
        {recent.length === 0 ? (
          <p className="text-sm text-center py-4" style={{ color: COLORS.inkMuted }}>Todavía no hay movimientos.</p>
        ) : (
          <div className="space-y-1">
            {recent.map((t) => <TransactionRow key={t.id} tx={t} accounts={accounts} categories={categories} currency={currency} onClick={() => onEditTransaction(t)} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function TabCuentas({ accounts, transactions, categories, currency, onAddAccount, onEditAccount, onEditTransaction }) {
  const [selected, setSelected] = useState(null);

  if (selected) {
    const acc = accounts.find((a) => a.id === selected);
    if (!acc) {
      return (
        <div>
          <button onClick={() => setSelected(null)} className="flex items-center gap-1 text-sm mb-4" style={{ color: COLORS.inkMuted }}><Icon name="chevron-left" size={16} /> Cuentas</button>
          <p className="text-sm" style={{ color: COLORS.inkMuted }}>Esta cuenta ya no existe.</p>
        </div>
      );
    }
    const accTx = transactions.filter((t) => t.accountId === selected || t.fromAccountId === selected || t.toAccountId === selected)
      .slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
    const balance = accountBalance(acc.id, accounts, transactions);
    return (
      <div>
        <button onClick={() => setSelected(null)} className="flex items-center gap-1 text-sm mb-4" style={{ color: COLORS.inkMuted }}><Icon name="chevron-left" size={16} /> Cuentas</button>
        <div className="rounded-2xl p-5 mb-3 text-center" style={{ background: acc.color }}>
          <p className="text-xs uppercase tracking-wide mb-1" style={{ color: "rgba(255,255,255,0.8)" }}>{acc.name}</p>
          <p className="font-mono text-2xl" style={{ color: "#fff" }}>{formatMoney(balance, currency)}</p>
        </div>
        <button onClick={() => onEditAccount(acc)} className="text-sm font-semibold mb-4" style={{ color: COLORS.gold }}>Editar cuenta</button>
        <p className="text-sm font-semibold mb-3" style={{ color: COLORS.ink }}>Movimientos</p>
        {accTx.length === 0 ? (
          <p className="text-sm text-center py-6" style={{ color: COLORS.inkMuted }}>Sin movimientos todavía.</p>
        ) : (
          <div className="rounded-2xl p-2" style={{ background: COLORS.card }}>
            {accTx.map((t) => <TransactionRow key={t.id} tx={t} accounts={accounts} categories={categories} currency={currency} onClick={() => onEditTransaction(t)} />)}
          </div>
        )}
      </div>
    );
  }

  const totalAll = accounts.reduce((s, a) => s + accountBalance(a.id, accounts, transactions), 0);
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-display text-lg" style={{ color: COLORS.ink }}>Cuentas</h2>
        <button onClick={onAddAccount} className="text-xs font-semibold px-3 py-2 rounded-full" style={{ background: COLORS.gold, color: "#fff" }}>+ Cuenta</button>
      </div>

      {accounts.length > 0 && (
        <div className="rounded-2xl p-5 mb-4" style={{ background: COLORS.card }}>
          <p className="text-sm font-semibold mb-1" style={{ color: COLORS.ink }}>Balance total</p>
          <p className="font-mono font-bold" style={{ fontSize: 30, color: totalAll < 0 ? COLORS.alert : COLORS.good }}>{formatMoney(totalAll, currency)}</p>
        </div>
      )}

      <div className="rounded-2xl p-2" style={{ background: COLORS.card }}>
        {accounts.map((acc, i) => {
          const balance = accountBalance(acc.id, accounts, transactions);
          return (
            <button key={acc.id} onClick={() => setSelected(acc.id)} className="w-full flex items-center gap-3 text-left p-2.5" style={{ borderBottom: i < accounts.length - 1 ? `1px solid ${COLORS.rule}` : "none" }}>
              <span className="rounded-xl flex items-center justify-center shrink-0 font-semibold" style={{ width: 40, height: 40, background: `${acc.color}26`, color: acc.color }}>
                {acc.name.charAt(0).toUpperCase()}
              </span>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium truncate" style={{ color: COLORS.ink }}>{acc.name}</p>
              </div>
              <span className="font-mono text-sm font-semibold" style={{ color: balance < 0 ? COLORS.alert : COLORS.ink }}>{formatMoney(balance, currency)}</span>
              <Icon name="chevron-right" size={16} style={{ color: COLORS.inkMuted }} />
            </button>
          );
        })}
        {accounts.length === 0 && <p className="text-sm text-center py-6" style={{ color: COLORS.inkMuted }}>Creá tu primera cuenta para empezar.</p>}
      </div>
    </div>
  );
}

function TabPresupuesto({ categories, budgets, transactions, currency, onSetBudget, onOpenConfig }) {
  const today = new Date();
  const monthKey = `${today.getFullYear()}-${pad(today.getMonth() + 1)}`;
  const expenseCats = categories.filter((c) => c.type === "expense");
  const [budgetTarget, setBudgetTarget] = useState(null);

  function spentInCategory(catId) {
    return transactions.filter((t) => t.kind === "expense" && t.categoryId === catId && t.date.slice(0, 7) === monthKey).reduce((s, t) => s + t.amount, 0);
  }

  return (
    <div>
      <h2 className="font-display text-lg mb-4 capitalize" style={{ color: COLORS.ink }}>Presupuesto de {MONTH_NAMES[today.getMonth()]}</h2>

      <div className="rounded-2xl p-2 mb-4" style={{ background: COLORS.card }}>
        {expenseCats.map((c, i) => {
          const budget = budgets[c.id] || 0;
          const spent = spentInCategory(c.id);
          const pct = budget > 0 ? (spent / budget) * 100 : 0;
          const over = budget > 0 && spent > budget;
          return (
            <div key={c.id} className="p-3" style={{ borderBottom: i < expenseCats.length - 1 ? `1px solid ${COLORS.rule}` : "none" }}>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-base">{c.emoji}</span>
                  <span className="text-sm font-medium" style={{ color: COLORS.ink }}>{c.name}</span>
                </div>
                <button onClick={() => setBudgetTarget(c)} className="text-xs font-semibold" style={{ color: COLORS.gold }}>{budget > 0 ? "Editar" : "Definir"}</button>
              </div>
              {budget > 0 ? (
                <>
                  <div className="relative h-2 rounded-full overflow-hidden mb-1.5" style={{ background: COLORS.rule }}>
                    <div className="h-full rounded-full" style={{ width: `${Math.min(pct, 100)}%`, background: over ? COLORS.alert : COLORS.gold, transition: "width 0.4s ease" }} />
                  </div>
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs" style={{ color: COLORS.inkMuted }}>{formatMoney(spent, currency)} / {formatMoney(budget, currency)}</span>
                    {over && <span className="text-xs flex items-center gap-1" style={{ color: COLORS.alert }}><Icon name="alert" size={12} /> Superado</span>}
                  </div>
                </>
              ) : (
                <p className="text-xs" style={{ color: COLORS.inkMuted }}>Gastado este mes: {formatMoney(spent, currency)}</p>
              )}
            </div>
          );
        })}
        {expenseCats.length === 0 && <p className="text-sm text-center py-6" style={{ color: COLORS.inkMuted }}>Creá una categoría de gastos para empezar a presupuestar.</p>}
      </div>

      <div className="rounded-2xl p-4 flex items-center justify-between" style={{ background: COLORS.card }}>
        <div>
          <p className="text-sm font-medium" style={{ color: COLORS.ink }}>Categorías</p>
          <p className="text-xs" style={{ color: COLORS.inkMuted }}>Creá, editá, reordená o borrá tus categorías</p>
        </div>
        <button onClick={onOpenConfig} className="text-xs font-semibold px-3 py-2 rounded-full shrink-0" style={{ background: COLORS.gold, color: "#fff" }}>Config.</button>
      </div>

      {budgetTarget && (
        <BudgetModal category={budgetTarget} currentAmount={budgets[budgetTarget.id] || 0} onClose={() => setBudgetTarget(null)}
          onSave={(amt) => { onSetBudget(budgetTarget.id, amt); setBudgetTarget(null); }} />
      )}
    </div>
  );
}

function TabTransacciones({ transactions, accounts, categories, currency, onEditTransaction }) {
  const [filter, setFilter] = useState("todos");
  const filtered = transactions.filter((t) => filter === "todos" ? true : filter === "gastos" ? t.kind === "expense" : filter === "ingresos" ? t.kind === "income" : t.kind === "transfer");
  const sorted = filtered.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
  const groups = [];
  {
    const map = new Map();
    for (const t of sorted) { if (!map.has(t.date)) map.set(t.date, []); map.get(t.date).push(t); }
    for (const [date, items] of map.entries()) groups.push({ date, items });
  }

  return (
    <div>
      <h2 className="font-display text-lg mb-4" style={{ color: COLORS.ink }}>Movimientos</h2>
      <div className="flex gap-1.5 mb-4 flex-wrap">
        {[["todos", "Todos"], ["gastos", "Gastos"], ["ingresos", "Ingresos"], ["transferencias", "Transferencias"]].map(([id, label]) => (
          <button key={id} onClick={() => setFilter(id)} className="text-xs font-semibold rounded-full" style={{ padding: "7px 14px", background: filter === id ? COLORS.gold : COLORS.card, color: filter === id ? "#fff" : COLORS.inkMuted }}>
            {label}
          </button>
        ))}
      </div>
      {groups.length === 0 ? (
        <p className="text-sm text-center py-8" style={{ color: COLORS.inkMuted }}>No hay movimientos para mostrar.</p>
      ) : (
        <div>
          {groups.map((g) => {
            const net = g.items.reduce((s, t) => s + (t.kind === "income" ? t.amount : t.kind === "expense" ? -t.amount : 0), 0);
            return (
              <div key={g.date} className="mb-4">
                <div className="flex items-center justify-between px-1 mb-1.5">
                  <p className="text-xs font-semibold capitalize" style={{ color: COLORS.inkMuted }}>{formatDayLabel(g.date)}</p>
                  <span className="font-mono font-semibold text-xs" style={{ color: net >= 0 ? COLORS.good : COLORS.alert }}>{net >= 0 ? "+" : "−"}{formatMoney(Math.abs(net), currency)}</span>
                </div>
                <div className="rounded-2xl p-2" style={{ background: COLORS.card }}>
                  {g.items.map((t, i) => (
                    <div key={t.id} style={{ borderBottom: i < g.items.length - 1 ? `1px solid ${COLORS.rule}` : "none" }}>
                      <TransactionRow tx={t} accounts={accounts} categories={categories} currency={currency} onClick={() => onEditTransaction(t)} />
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TabGraficos({ transactions, categories, currency, viewYear, viewMonth, onPrevMonth, onNextMonth }) {
  const monthKey = `${viewYear}-${pad(viewMonth)}`;
  const monthExpenses = transactions.filter((t) => t.kind === "expense" && t.date.slice(0, 7) === monthKey);
  const byCategory = categories.filter((c) => c.type === "expense").map((c) => ({
    ...c, total: monthExpenses.filter((e) => e.categoryId === c.id).reduce((s, e) => s + e.amount, 0),
  })).filter((c) => c.total > 0).sort((a, b) => b.total - a.total);
  const totalExpense = byCategory.reduce((s, c) => s + c.total, 0);

  const last6 = [];
  for (let i = 5; i >= 0; i--) {
    let y = viewYear, m = viewMonth - i;
    while (m <= 0) { m += 12; y -= 1; }
    const k = `${y}-${pad(m)}`;
    const ingresos = transactions.filter((t) => t.kind === "income" && t.date.slice(0, 7) === k).reduce((s, t) => s + t.amount, 0);
    const gastos = transactions.filter((t) => t.kind === "expense" && t.date.slice(0, 7) === k).reduce((s, t) => s + t.amount, 0);
    last6.push({ key: k, label: MONTH_SHORT[m - 1], ingresos, gastos });
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <button onClick={onPrevMonth} className="p-2 rounded-full" style={{ background: COLORS.card }} aria-label="Mes anterior"><Icon name="chevron-left" size={16} style={{ color: COLORS.inkMuted }} /></button>
        <span className="text-sm font-medium capitalize" style={{ color: COLORS.ink }}>{MONTH_NAMES[viewMonth - 1]} {viewYear}</span>
        <button onClick={onNextMonth} className="p-2 rounded-full" style={{ background: COLORS.card }} aria-label="Mes siguiente"><Icon name="chevron-right" size={16} style={{ color: COLORS.inkMuted }} /></button>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.card }}>
        <p className="text-sm font-semibold mb-2" style={{ color: COLORS.ink }}>Gastos por categoría</p>
        {byCategory.length === 0 ? (
          <p className="text-sm text-center py-4" style={{ color: COLORS.inkMuted }}>Sin gastos este mes.</p>
        ) : (
          <>
            <DonutChart data={byCategory} currency={currency} />
            <div className="mt-2">
              {byCategory.map((c, i) => (
                <div key={c.id} className="flex items-center gap-2.5 py-2" style={{ borderBottom: i < byCategory.length - 1 ? `1px solid ${COLORS.rule}` : "none" }}>
                  <span className="rounded-md shrink-0" style={{ width: 10, height: 10, background: c.color }} />
                  <span className="flex-1 text-sm" style={{ color: COLORS.ink }}>{c.name}</span>
                  <span className="text-xs" style={{ color: COLORS.inkMuted }}>{((c.total / totalExpense) * 100).toFixed(0)}%</span>
                  <span className="font-mono text-sm font-semibold" style={{ color: COLORS.ink }}>{formatMoney(c.total, currency)}</span>
                </div>
              ))}
            </div>
          </>
        )}
      </div>

      <div className="rounded-2xl p-4" style={{ background: COLORS.card }}>
        <p className="text-sm font-semibold mb-2" style={{ color: COLORS.ink }}>Ingresos vs. gastos · últimos 6 meses</p>
        <div className="flex items-center gap-3 mb-2">
          <span className="flex items-center gap-1 text-xs" style={{ color: COLORS.inkMuted }}><span style={{ width: 8, height: 8, borderRadius: 999, background: COLORS.good, display: "inline-block" }} /> Ingresos</span>
          <span className="flex items-center gap-1 text-xs" style={{ color: COLORS.inkMuted }}><span style={{ width: 8, height: 8, borderRadius: 999, background: COLORS.alert, display: "inline-block" }} /> Gastos</span>
        </div>
        <GroupedBarChart data={last6} currency={currency} />
      </div>
    </div>
  );
}

/* ---------------- modals ---------------- */

function TransactionModal({ mode, initialKind, initialData, accounts, categories, currency, onClose, onSave, onDelete, onAddCategory }) {
  const editing = mode === "edit";
  const [kind, setKind] = useState(editing ? initialData.kind : initialKind);
  const [amount, setAmount] = useState(editing ? String(initialData.amount) : "");
  const [accountId, setAccountId] = useState(editing ? initialData.accountId : (accounts[0] ? accounts[0].id : ""));
  const [categoryId, setCategoryId] = useState(editing ? initialData.categoryId : "");
  const [note, setNote] = useState(editing ? (initialData.note || "") : "");
  const [date, setDate] = useState(editing ? initialData.date : todayStr());
  const [time, setTime] = useState(editing ? (initialData.time || "") : "");
  const [recurrence, setRecurrence] = useState("none");
  const [error, setError] = useState("");
  const [showNewCat, setShowNewCat] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [newCatColor, setNewCatColor] = useState(PALETTE[0]);
  const [newCatEmoji, setNewCatEmoji] = useState("💰");

  const availableCats = categories.filter((c) => c.type === kind);

  useEffect(() => {
    if (categoryId && !availableCats.some((c) => c.id === categoryId)) {
      setCategoryId(availableCats[0] ? availableCats[0].id : "");
    } else if (!categoryId && availableCats[0]) {
      setCategoryId(availableCats[0].id);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [kind]);

  function handleCreateCategory() {
    if (!newCatName.trim()) return;
    const cat = onAddCategory({ name: newCatName.trim(), type: kind, color: newCatColor, emoji: newCatEmoji || "💰" });
    setCategoryId(cat.id);
    setShowNewCat(false);
    setNewCatName("");
    setNewCatEmoji("💰");
  }

  function handleSubmit() {
    const num = parseFloat(amount);
    if (!amount || isNaN(num) || num <= 0) { setError("Ingresá un monto válido"); return; }
    if (!accountId) { setError("Elegí una cuenta"); return; }
    if (!categoryId) { setError("Elegí o creá una categoría"); return; }
    if (!date) { setError("Elegí una fecha"); return; }
    const payload = { kind, amount: num, accountId, categoryId, note: note.trim(), date, time: time || null };
    if (!editing) payload.recurrence = recurrence;
    onSave(payload);
  }

  return (
    <Modal title={editing ? "Editar movimiento" : "Nuevo movimiento"} onClose={onClose}>
      {!editing && (
        <div className="flex rounded-xl overflow-hidden mb-4" style={{ border: `1px solid ${COLORS.rule}` }}>
          {["expense", "income"].map((k) => (
            <button key={k} onClick={() => setKind(k)} className="flex-1 py-2.5 text-sm font-medium" style={{ background: kind === k ? (k === "expense" ? COLORS.alert : COLORS.good) : "transparent", color: kind === k ? COLORS.goldInk : COLORS.inkMuted }}>
              {k === "expense" ? "Gasto" : "Ingreso"}
            </button>
          ))}
        </div>
      )}

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Monto</label>
      <div className="flex items-center rounded-xl px-3 mb-4" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper }}>
        <span className="font-mono text-lg mr-1" style={{ color: COLORS.inkMuted }}>{currency}</span>
        <input type="number" inputMode="decimal" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} className="font-mono text-lg py-2.5 flex-1 outline-none bg-transparent" style={{ color: COLORS.ink }} />
      </div>

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Cuenta</label>
      <select value={accountId} onChange={(e) => setAccountId(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }}>
        {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
      </select>

      <div className="flex items-center justify-between mb-2">
        <label className="block text-xs" style={{ color: COLORS.inkMuted }}>Categoría</label>
        <button onClick={() => setShowNewCat((v) => !v)} className="text-xs font-medium" style={{ color: COLORS.gold }}>+ nueva</button>
      </div>

      {showNewCat && (
        <div className="rounded-xl p-3 mb-3" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper }}>
          <div className="flex gap-2 mb-2">
            <input type="text" maxLength={2} value={newCatEmoji} onChange={(e) => setNewCatEmoji(e.target.value)} className="w-12 text-center rounded-lg py-2 outline-none" style={{ border: `1px solid ${COLORS.rule}` }} />
            <input type="text" placeholder="Nombre de la categoría" value={newCatName} onChange={(e) => setNewCatName(e.target.value)} className="flex-1 rounded-lg px-2.5 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}` }} />
          </div>
          <div className="flex gap-1.5 mb-2 flex-wrap">
            {PALETTE.map((c) => (
              <button key={c} onClick={() => setNewCatColor(c)} style={{ width: 20, height: 20, borderRadius: 999, background: c, border: newCatColor === c ? `2px solid ${COLORS.ink}` : "2px solid transparent" }} />
            ))}
          </div>
          <button onClick={handleCreateCategory} className="w-full rounded-lg py-2 text-xs font-medium" style={{ background: COLORS.gold, color: COLORS.goldInk }}>Crear categoría</button>
        </div>
      )}

      <div className="grid grid-cols-4 gap-2 mb-4">
        {availableCats.map((c) => {
          const active = categoryId === c.id;
          return (
            <button key={c.id} onClick={() => setCategoryId(c.id)} className="flex flex-col items-center gap-1 py-2.5 rounded-xl text-center" style={{ border: `1px solid ${active ? c.color : COLORS.rule}`, background: active ? `${c.color}1F` : "transparent" }}>
              <span className="text-base">{c.emoji}</span>
              <span className="leading-tight" style={{ fontSize: 10, color: active ? c.color : COLORS.inkMuted }}>{c.name}</span>
            </button>
          );
        })}
        {availableCats.length === 0 && <p className="col-span-4 text-xs" style={{ color: COLORS.inkMuted }}>No hay categorías de {kind === "expense" ? "gastos" : "ingresos"} todavía. Creá una arriba.</p>}
      </div>

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Descripción</label>
      <input type="text" placeholder="¿De qué se trata?" value={note} onChange={(e) => setNote(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />

      <div className="grid grid-cols-2 gap-2 mb-4">
        <div>
          <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Fecha</label>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full rounded-xl px-3 py-2.5 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Hora (opcional)</label>
          <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full rounded-xl px-3 py-2.5 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />
        </div>
      </div>

      {!editing && (
        <>
          <label className="block text-xs mb-2" style={{ color: COLORS.inkMuted }}>Repetir</label>
          <div className="flex rounded-xl overflow-hidden mb-2" style={{ border: `1px solid ${COLORS.rule}` }}>
            {[["none", "No repetir"], ["weekly", "Cada semana"], ["monthly", "Cada mes"]].map(([id, label]) => (
              <button key={id} onClick={() => setRecurrence(id)} className="flex-1 py-2.5 text-xs font-medium" style={{ background: recurrence === id ? COLORS.gold : "transparent", color: recurrence === id ? COLORS.goldInk : COLORS.inkMuted }}>
                {label}
              </button>
            ))}
          </div>
          {recurrence !== "none" && <p className="text-xs mb-4" style={{ color: COLORS.inkMuted }}>Se van a crear los próximos {recurrence === "weekly" ? "12 movimientos (unas 12 semanas)" : "12 meses"} a partir de esta fecha.</p>}
        </>
      )}

      {error && <p className="text-xs mb-3" style={{ color: COLORS.alert }}>{error}</p>}

      <button onClick={handleSubmit} className="w-full rounded-xl py-3 text-sm font-medium mb-2" style={{ background: COLORS.gold, color: COLORS.goldInk }}>
        {editing ? "Guardar cambios" : "Guardar"}
      </button>

      {editing && (
        initialData.recurrenceGroupId ? (
          <div className="flex gap-2">
            <button onClick={() => onDelete(initialData.id, false)} className="flex-1 rounded-xl py-2.5 text-xs font-medium" style={{ border: `1px solid ${COLORS.alert}`, color: COLORS.alert }}>Eliminar esta</button>
            <button onClick={() => onDelete(initialData.id, true)} className="flex-1 rounded-xl py-2.5 text-xs font-medium" style={{ border: `1px solid ${COLORS.alert}`, color: COLORS.alert }}>Esta y futuras</button>
          </div>
        ) : (
          <button onClick={() => onDelete(initialData.id, false)} className="w-full rounded-xl py-2.5 text-xs font-medium" style={{ border: `1px solid ${COLORS.alert}`, color: COLORS.alert }}>Eliminar</button>
        )
      )}
    </Modal>
  );
}

function TransferModal({ mode, initialData, accounts, currency, onClose, onSave, onDelete }) {
  const editing = mode === "edit";
  const [amount, setAmount] = useState(editing ? String(initialData.amount) : "");
  const [fromAccountId, setFromAccountId] = useState(editing ? initialData.fromAccountId : (accounts[0] ? accounts[0].id : ""));
  const [toAccountId, setToAccountId] = useState(editing ? initialData.toAccountId : (accounts[1] ? accounts[1].id : (accounts[0] ? accounts[0].id : "")));
  const [note, setNote] = useState(editing ? (initialData.note || "") : "");
  const [date, setDate] = useState(editing ? initialData.date : todayStr());
  const [error, setError] = useState("");

  function handleSubmit() {
    const num = parseFloat(amount);
    if (!amount || isNaN(num) || num <= 0) { setError("Ingresá un monto válido"); return; }
    if (!fromAccountId || !toAccountId) { setError("Elegí ambas cuentas"); return; }
    if (fromAccountId === toAccountId) { setError("Elegí dos cuentas distintas"); return; }
    onSave({ amount: num, fromAccountId, toAccountId, note: note.trim(), date });
  }

  return (
    <Modal title={editing ? "Editar transferencia" : "Transferencia entre cuentas"} onClose={onClose}>
      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Monto</label>
      <div className="flex items-center rounded-xl px-3 mb-4" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper }}>
        <span className="font-mono text-lg mr-1" style={{ color: COLORS.inkMuted }}>{currency}</span>
        <input type="number" inputMode="decimal" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} className="font-mono text-lg py-2.5 flex-1 outline-none bg-transparent" style={{ color: COLORS.ink }} />
      </div>

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Desde</label>
      <select value={fromAccountId} onChange={(e) => setFromAccountId(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }}>
        {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
      </select>

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Hacia</label>
      <select value={toAccountId} onChange={(e) => setToAccountId(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }}>
        {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
      </select>

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Nota (opcional)</label>
      <input type="text" placeholder="Ej: ahorro del mes" value={note} onChange={(e) => setNote(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Fecha</label>
      <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />

      {error && <p className="text-xs mb-3" style={{ color: COLORS.alert }}>{error}</p>}

      <button onClick={handleSubmit} className="w-full rounded-xl py-3 text-sm font-medium mb-2" style={{ background: COLORS.gold, color: COLORS.goldInk }}>
        {editing ? "Guardar cambios" : "Transferir"}
      </button>

      {editing && (
        <button onClick={() => onDelete(initialData.id)} className="w-full rounded-xl py-2.5 text-xs font-medium" style={{ border: `1px solid ${COLORS.alert}`, color: COLORS.alert }}>Eliminar</button>
      )}
    </Modal>
  );
}

function AccountModal({ mode, initialData, deletable, onClose, onSave, onDelete }) {

  const [initialBalance, setInitialBalance] = useState(editing ? String(initialData.initialBalance) : "0");

  function handleSubmit() {
    if (!name.trim()) { setError("Ponele un nombre a la cuenta"); return; }
    const bal = parseFloat(initialBalance) || 0;
    onSave({ name: name.trim(), color, initialBalance: bal });
  }

  return (
    <Modal title={editing ? "Editar cuenta" : "Nueva cuenta"} onClose={onClose}>
      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Nombre</label>
      <input type="text" placeholder="Ej: Efectivo, Banco, Ahorros" value={name} onChange={(e) => setName(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />

      <label className="block text-xs mb-2" style={{ color: COLORS.inkMuted }}>Color</label>
      <div className="flex gap-1.5 mb-4 flex-wrap">
        {PALETTE.map((c) => (
          <button key={c} onClick={() => setColor(c)} style={{ width: 24, height: 24, borderRadius: 999, background: c, border: color === c ? `2px solid ${COLORS.ink}` : "2px solid transparent" }} />
        ))}
      </div>

      <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Saldo inicial</label>
      <input type="number" inputMode="decimal" value={initialBalance} onChange={(e) => setInitialBalance(e.target.value)} className="w-full rounded-xl px-3 py-2.5 mb-4 outline-none font-mono text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />

      {error && <p className="text-xs mb-3" style={{ color: COLORS.alert }}>{error}</p>}

      <button onClick={handleSubmit} className="w-full rounded-xl py-3 text-sm font-medium mb-2" style={{ background: COLORS.gold, color: COLORS.goldInk }}>
        {editing ? "Guardar cambios" : "Crear cuenta"}
      </button>

      {editing && (
        deletable ? (
          <button onClick={() => onDelete(initialData.id)} className="w-full rounded-xl py-2.5 text-xs font-medium" style={{ border: `1px solid ${COLORS.alert}`, color: COLORS.alert }}>Eliminar cuenta</button>
        ) : (
          <p className="text-xs text-center" style={{ color: COLORS.inkMuted }}>No se puede eliminar: es la única cuenta o tiene movimientos asociados</p>
        )
      )}
    </Modal>
  );
}

function BudgetModal({ category, currentAmount, onClose, onSave }) {

      <button onClick={() => onSave(parseFloat(amount) || 0)} className="w-full rounded-xl py-3 text-sm font-medium" style={{ background: COLORS.gold, color: COLORS.goldInk }}>Guardar</button>

        ) : (
          <p className="text-xs text-center" style={{ color: COLORS.inkMuted }}>No se puede eliminar: tiene movimientos asociados</p>

function ConfigView({
  accounts, categories, currency, onClose,
  onAddAccount, onEditAccount, onDeleteAccount, onMoveAccount,
  onAddCategory, onEditCategory, onDeleteCategory, onMoveCategory,
  onSetCurrency, onExport,
}) {
  const expenseCats = categories.filter((c) => c.type === "expense");
  const incomeCats = categories.filter((c) => c.type === "income");
  const [curr, setCurr] = useState(currency);
  const [error, setError] = useState("");
  const [exportMsg, setExportMsg] = useState("");

  async function handleExport() {
    setExportMsg("");
    try { setExportMsg(await onExport()); } catch (e) { setExportMsg("No se pudo exportar: " + (e && e.message ? e.message : e)); }
  }

  function handleDeleteAccount(id) {
    const ok = onDeleteAccount(id);
    setError(ok ? "" : "No se puede eliminar: es la única cuenta o tiene movimientos asociados");
  }
  function handleDeleteCategory(id) {
    const ok = onDeleteCategory(id);
    setError(ok ? "" : "No se puede eliminar: tiene movimientos asociados");
  }

  return (
    <div className="max-w-md mx-auto px-4 pt-6 pb-10">
      <div className="flex items-center justify-between mb-5">
        <button onClick={onClose} className="flex items-center gap-1 text-sm" style={{ color: COLORS.inkMuted }}><Icon name="chevron-left" size={16} /> Volver</button>
        <h2 className="font-display text-lg" style={{ color: COLORS.ink }}>Configuración</h2>
        <span style={{ width: 46 }} />
      </div>

      {error && (
        <div className="mb-4 px-3 py-2 rounded-lg text-xs" style={{ background: "rgba(222,122,108,0.14)", color: COLORS.alert, border: `1px solid ${COLORS.alert}` }}>{error}</div>
      )}

      <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.rule}` }}>
        <label className="block text-xs mb-1" style={{ color: COLORS.inkMuted }}>Símbolo de moneda</label>
        <div className="flex gap-2">
          <input type="text" maxLength={3} value={curr} onChange={(e) => setCurr(e.target.value)} className="flex-1 rounded-xl px-3 py-2 outline-none text-sm" style={{ border: `1px solid ${COLORS.rule}`, background: COLORS.paper, color: COLORS.ink }} />
          <button onClick={() => onSetCurrency(curr.trim() || "$")} className="px-4 rounded-xl text-xs font-medium" style={{ background: COLORS.gold, color: COLORS.goldInk }}>Guardar</button>
        </div>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.rule}` }}>
        <p className="text-xs uppercase tracking-wide mb-1" style={{ color: COLORS.inkMuted }}>Respaldo</p>
        <p className="text-xs mb-3" style={{ color: COLORS.inkMuted }}>Saca una copia de todo (cuentas, categorías, movimientos y presupuestos) en un archivo .json.</p>
        <button onClick={handleExport} className="w-full rounded-xl py-2.5 text-sm font-medium" style={{ background: COLORS.gold, color: COLORS.goldInk }}>Exportar mis datos</button>
        {exportMsg && <p className="text-xs mt-2" style={{ color: COLORS.inkMuted }}>{exportMsg}</p>}
      </div>

      <SettingsSection title="Cuentas" onAdd={onAddAccount}>
        {accounts.map((a, i) => (
          <SettingsRow key={a.id} colorDot={a.color} label={a.name}
            onEdit={() => onEditAccount(a)} onDelete={() => handleDeleteAccount(a.id)}
            onUp={i > 0 ? () => onMoveAccount(a.id, -1) : null} onDown={i < accounts.length - 1 ? () => onMoveAccount(a.id, 1) : null} />
        ))}
        {accounts.length === 0 && <p className="text-xs" style={{ color: COLORS.inkMuted }}>No hay cuentas todavía.</p>}
      </SettingsSection>

      <SettingsSection title="Categorías de gastos" onAdd={() => onAddCategory("expense")}>
        {expenseCats.map((c, i) => (
          <SettingsRow key={c.id} emoji={c.emoji} label={c.name}
            onEdit={() => onEditCategory(c)} onDelete={() => handleDeleteCategory(c.id)}
            onUp={i > 0 ? () => onMoveCategory(c.id, -1) : null} onDown={i < expenseCats.length - 1 ? () => onMoveCategory(c.id, 1) : null} />
        ))}
        {expenseCats.length === 0 && <p className="text-xs" style={{ color: COLORS.inkMuted }}>No hay categorías de gastos.</p>}
      </SettingsSection>

      <SettingsSection title="Categorías de ingresos" onAdd={() => onAddCategory("income")}>
        {incomeCats.map((c, i) => (
          <SettingsRow key={c.id} emoji={c.emoji} label={c.name}
            onEdit={() => onEditCategory(c)} onDelete={() => handleDeleteCategory(c.id)}
            onUp={i > 0 ? () => onMoveCategory(c.id, -1) : null} onDown={i < incomeCats.length - 1 ? () => onMoveCategory(c.id, 1) : null} />
        ))}
        {incomeCats.length === 0 && <p className="text-xs" style={{ color: COLORS.inkMuted }}>No hay categorías de ingresos.</p>}
      </SettingsSection>
    </div>
  );
}

/* ---------------- main app ---------------- */

function FinanceApp() {
  const [loading, setLoading] = useState(true);
  const [accounts, setAccounts] = useState([]);
  const [categories, setCategories] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [budgets, setBudgets] = useState({});
  const [currency, setCurrency] = useState("$");
  const [activeTab, setActiveTab] = useState("resumen");
  const [viewYear, setViewYear] = useState(() => new Date().getFullYear());
  const [viewMonth, setViewMonth] = useState(() => new Date().getMonth() + 1);
  const [saveError, setSaveError] = useState(false);

  const [showSheet, setShowSheet] = useState(false);
  const [showConfig, setShowConfig] = useState(false);
  const [txModal, setTxModal] = useState(null);
  const [transferModal, setTransferModal] = useState(null);
  const [accountModal, setAccountModal] = useState(null);
  const [categoryModal, setCategoryModal] = useState(null);

  const loadedRef = useRef(false);

  function seedDefaults() {
    setAccounts([{ id: "acc-efectivo", name: "Efectivo", color: PALETTE[1], initialBalance: 0 }]);
    setCategories([
      { id: "cat-comida", name: "Comida", type: "expense", color: PALETTE[0], emoji: "🍔" },
      { id: "cat-transporte", name: "Transporte", type: "expense", color: PALETTE[1], emoji: "🚌" },
      { id: "cat-vivienda", name: "Vivienda", type: "expense", color: PALETTE[2], emoji: "🏠" },
      { id: "cat-servicios", name: "Servicios", type: "expense", color: PALETTE[3], emoji: "⚡" },
      { id: "cat-entretenimiento", name: "Entretenimiento", type: "expense", color: PALETTE[4], emoji: "🎬" },
      { id: "cat-salud", name: "Salud", type: "expense", color: PALETTE[5], emoji: "❤️" },
      { id: "cat-compras", name: "Compras", type: "expense", color: PALETTE[6], emoji: "🛍️" },
      { id: "cat-otros", name: "Otros", type: "expense", color: PALETTE[7], emoji: "✳️" },
      { id: "cat-sueldo", name: "Sueldo", type: "income", color: PALETTE[4], emoji: "💼" },
      { id: "cat-freelance", name: "Freelance", type: "income", color: PALETTE[5], emoji: "💻" },
      { id: "cat-regalos", name: "Regalos", type: "income", color: PALETTE[6], emoji: "🎁" },
      { id: "cat-otrosing", name: "Otros ingresos", type: "income", color: PALETTE[7], emoji: "✳️" },
    ]);
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem("finance-data");
      if (raw) {
        const data = JSON.parse(raw);
        setAccounts(Array.isArray(data.accounts) ? data.accounts : []);
        setCategories(Array.isArray(data.categories) ? data.categories : []);
        setTransactions(Array.isArray(data.transactions) ? data.transactions : []);
        setBudgets(data.budgets && typeof data.budgets === "object" ? data.budgets : {});
        setCurrency(typeof data.currency === "string" ? data.currency : "$");
      } else {
        seedDefaults();
      }
    } catch (e) {
      seedDefaults();
    } finally {
      loadedRef.current = true;
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (!loadedRef.current) return;
    try {
      localStorage.setItem("finance-data", JSON.stringify({ accounts, categories, transactions, budgets, currency }));
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }, [accounts, categories, transactions, budgets, currency]);

  function addAccount(data) { setAccounts((prev) => [...prev, { id: `acc-${Date.now()}`, ...data }]); }
  function updateAccount(id, updates) { setAccounts((prev) => prev.map((a) => a.id === id ? { ...a, ...updates } : a)); }
  function deleteAccountSafe(id) {
    if (accounts.length <= 1) return false;
    if (transactions.some((t) => t.accountId === id || t.fromAccountId === id || t.toAccountId === id)) return false;
    setAccounts((prev) => prev.filter((a) => a.id !== id));
    return true;
  }

  function addCategory(data) {
    const cat = { id: `cat-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`, ...data };
    setCategories((prev) => [...prev, cat]);
    return cat;
  }
  function deleteCategorySafe(id) {
    if (transactions.some((t) => t.categoryId === id)) return false;
    setCategories((prev) => prev.filter((c) => c.id !== id));
    setBudgets((prev) => { const n = { ...prev }; delete n[id]; return n; });
    return true;
  }

  function updateCategory(id, updates) { setCategories((prev) => prev.map((c) => c.id === id ? { ...c, ...updates } : c)); }

  function moveAccount(id, direction) {
    setAccounts((prev) => {
      const idx = prev.findIndex((a) => a.id === id);
      const newIdx = idx + direction;
      if (idx < 0 || newIdx < 0 || newIdx >= prev.length) return prev;
      const copy = [...prev];
      [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
      return copy;
    });
  }

  function moveCategory(id, direction) {
    setCategories((prev) => {
      const cat = prev.find((c) => c.id === id);
      if (!cat) return prev;
      const sameType = prev.filter((c) => c.type === cat.type);
      const otherType = prev.filter((c) => c.type !== cat.type);
      const idx = sameType.findIndex((c) => c.id === id);
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= sameType.length) return prev;
      const copy = [...sameType];
      [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
      return cat.type === "expense" ? [...copy, ...otherType] : [...otherType, ...copy];
    });
  }

  function setBudgetFor(categoryId, amount) { setBudgets((prev) => ({ ...prev, [categoryId]: amount })); }

  // Respaldo: primero el menú de compartir de iOS (Guardar en Archivos, AirDrop, mail), si no se puede
  // se copia el JSON al portapapeles, y como último recurso se descarga.
  async function exportData() {
    const payload = { app: "libro-de-gastos", version: 1, exportedAt: new Date().toISOString(), accounts, categories, transactions, budgets, currency };
    const json = JSON.stringify(payload, null, 2);
    const name = `gastos-${todayStr()}.json`;
    const resumen = `${transactions.length} movimientos, ${accounts.length} cuentas, ${categories.length} categorías`;
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return `Listo: ${resumen}.`; }
      catch (e) { if (e && e.name === "AbortError") return "Cancelado."; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(json); return `Copiado al portapapeles (${resumen}). Pégalo en una nota.`; } catch (e) {}
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    return `Descargado: ${resumen}.`;
  }

  function addTransaction(data) {
    const base = { kind: data.kind, amount: data.amount, accountId: data.accountId, categoryId: data.categoryId, note: data.note, date: data.date, time: data.time };
    if (data.recurrence && data.recurrence !== "none") {
      const groupId = `grp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      const count = 12;
      const occurrences = [];
      for (let i = 0; i < count; i++) {
        const date = i === 0 ? base.date : addPeriod(base.date, data.recurrence, i);
        occurrences.push({ ...base, id: `${groupId}-${i}`, date, recurrence: data.recurrence, recurrenceGroupId: groupId });
      }
      setTransactions((prev) => [...prev, ...occurrences]);
    } else {
      setTransactions((prev) => [...prev, { ...base, id: `tx-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, recurrence: null, recurrenceGroupId: null }]);
    }
  }
  function updateTransaction(id, updates) { setTransactions((prev) => prev.map((t) => t.id === id ? { ...t, ...updates } : t)); }
  function deleteTransaction(id, includeFuture) {
    setTransactions((prev) => {
      const target = prev.find((t) => t.id === id);
      if (!target) return prev;
      if (includeFuture && target.recurrenceGroupId) {
        return prev.filter((t) => !(t.recurrenceGroupId === target.recurrenceGroupId && t.date >= target.date));
      }
      return prev.filter((t) => t.id !== id);
    });
  }

  function addTransfer(data) {
    setTransactions((prev) => [...prev, { id: `tf-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, kind: "transfer", amount: data.amount, date: data.date, time: null, fromAccountId: data.fromAccountId, toAccountId: data.toAccountId, note: data.note, recurrence: null, recurrenceGroupId: null }]);
  }

  function prevMonthNav() { if (viewMonth === 1) { setViewMonth(12); setViewYear((y) => y - 1); } else setViewMonth((m) => m - 1); }
  function nextMonthNav() { if (viewMonth === 12) { setViewMonth(1); setViewYear((y) => y + 1); } else setViewMonth((m) => m + 1); }

  function openEditTransaction(tx) {
    if (tx.kind === "transfer") setTransferModal({ mode: "edit", data: tx });
    else setTxModal({ mode: "edit", kind: tx.kind, data: tx });
  }
  function handleSheetPick(kind) {
    setShowSheet(false);
    if (kind === "transfer") setTransferModal({ mode: "create", data: null });
    else setTxModal({ mode: "create", kind, data: null });
  }

  if (loading) {
    return (
      <div style={{ background: COLORS.paper, minHeight: "100vh" }} className="flex items-center justify-center">
        <p style={{ color: COLORS.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif" }}>Abriendo el libro…</p>
      </div>
    );
  }

  return (
    <div style={{ background: COLORS.paper, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif", color: COLORS.ink }}>
      {showConfig ? (
        <ConfigView
          accounts={accounts} categories={categories} currency={currency}
          onClose={() => setShowConfig(false)}
          onAddAccount={() => setAccountModal({ mode: "create", data: null })}
          onEditAccount={(acc) => setAccountModal({ mode: "edit", data: acc })}
          onDeleteAccount={deleteAccountSafe}
          onMoveAccount={moveAccount}
          onAddCategory={(type) => setCategoryModal({ mode: "create", defaultType: type, data: null })}
          onEditCategory={(cat) => setCategoryModal({ mode: "edit", data: cat })}
          onDeleteCategory={deleteCategorySafe}
          onMoveCategory={moveCategory}
          onSetCurrency={setCurrency}
          onExport={exportData}
        />
      ) : (
        <>
          <div className="max-w-md mx-auto" style={{ padding: "24px 20px 4px 20px" }}>
            <div className="flex items-center justify-between">
              <h1 className="font-display text-xl" style={{ color: COLORS.ink }}>{{ resumen: "Resumen", cuentas: "Cuentas", presupuesto: "Presupuesto", transacciones: "Movimientos", graficos: "Gráficos" }[activeTab]}</h1>
              <button onClick={() => setShowConfig(true)} className="p-2 rounded-full flex items-center justify-center" style={{ background: COLORS.card, width: 38, height: 38 }} aria-label="Configuración">
                <Icon name="settings" size={16} style={{ color: COLORS.inkMuted }} />
              </button>
            </div>
          </div>

          <div className="max-w-md mx-auto px-5 pb-32 pt-4">
            {saveError && (
              <div className="mb-4 px-3 py-2 rounded-lg text-xs" style={{ background: "rgba(222,122,108,0.14)", color: COLORS.alert, border: `1px solid ${COLORS.alert}` }}>
                No se pudo guardar el último cambio. Revisá tu conexión.
              </div>
            )}

            {activeTab === "resumen" && (
              <TabResumen accounts={accounts} transactions={transactions} categories={categories} currency={currency} viewYear={viewYear} viewMonth={viewMonth} onPrevMonth={prevMonthNav} onNextMonth={nextMonthNav} onEditTransaction={openEditTransaction} onGoTo={setActiveTab} />
            )}
            {activeTab === "cuentas" && (
              <TabCuentas accounts={accounts} transactions={transactions} categories={categories} currency={currency} onAddAccount={() => setAccountModal({ mode: "create", data: null })} onEditAccount={(acc) => setAccountModal({ mode: "edit", data: acc })} onEditTransaction={openEditTransaction} />
            )}
            {activeTab === "presupuesto" && (
              <TabPresupuesto categories={categories} budgets={budgets} transactions={transactions} currency={currency} onSetBudget={setBudgetFor} onOpenConfig={() => setShowConfig(true)} />
            )}
            {activeTab === "transacciones" && (
              <TabTransacciones transactions={transactions} accounts={accounts} categories={categories} currency={currency} onEditTransaction={openEditTransaction} />
            )}
            {activeTab === "graficos" && (
              <TabGraficos transactions={transactions} categories={categories} currency={currency} viewYear={viewYear} viewMonth={viewMonth} onPrevMonth={prevMonthNav} onNextMonth={nextMonthNav} />
            )}
          </div>

          <button onClick={() => setShowSheet(true)} className="fixed left-1/2 -translate-x-1/2 rounded-full z-30 flex items-center justify-center" style={{ bottom: 78, width: 54, height: 54, background: COLORS.gold, boxShadow: "0 4px 14px rgba(59,130,246,0.4)" }} aria-label="Agregar">
            <Icon name="plus" size={22} style={{ color: "#fff" }} />
          </button>

          <BottomNav active={activeTab} onChange={setActiveTab} />

          {showSheet && <QuickActionSheet onClose={() => setShowSheet(false)} onPick={handleSheetPick} />}
        </>
      )}

      {txModal && (
        <TransactionModal
          mode={txModal.mode} initialKind={txModal.kind} initialData={txModal.data}
          accounts={accounts} categories={categories} currency={currency}
          onClose={() => setTxModal(null)}
          onSave={(data) => { if (txModal.mode === "edit") updateTransaction(txModal.data.id, data); else addTransaction(data); setTxModal(null); }}
          onDelete={(id, includeFuture) => { deleteTransaction(id, includeFuture); setTxModal(null); }}
          onAddCategory={addCategory}
        />
      )}

      {transferModal && (
        <TransferModal
          mode={transferModal.mode} initialData={transferModal.data} accounts={accounts} currency={currency}
          onClose={() => setTransferModal(null)}
          onSave={(data) => { if (transferModal.mode === "edit") updateTransaction(transferModal.data.id, data); else addTransfer(data); setTransferModal(null); }}
          onDelete={(id) => { deleteTransaction(id, false); setTransferModal(null); }}
        />
      )}

      {accountModal && (
        <AccountModal
          mode={accountModal.mode} initialData={accountModal.data}
          deletable={accountModal.mode === "edit" ? (accounts.length > 1 && !transactions.some((t) => t.accountId === accountModal.data.id || t.fromAccountId === accountModal.data.id || t.toAccountId === accountModal.data.id)) : true}
          onClose={() => setAccountModal(null)}
          onSave={(data) => { if (accountModal.mode === "edit") updateAccount(accountModal.data.id, data); else addAccount(data); setAccountModal(null); }}
          onDelete={(id) => { deleteAccountSafe(id); setAccountModal(null); }}
        />
      )}

      {categoryModal && (
        <CategoryModal
          mode={categoryModal.mode} initialData={categoryModal.data} defaultType={categoryModal.defaultType}
          deletable={categoryModal.mode === "edit" ? !transactions.some((t) => t.categoryId === categoryModal.data.id) : true}
          onClose={() => setCategoryModal(null)}
          onSave={(data) => { if (categoryModal.mode === "edit") updateCategory(categoryModal.data.id, data); else addCategory(data); setCategoryModal(null); }}
          onDelete={(id) => { deleteCategorySafe(id); setCategoryModal(null); }}
        />
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<FinanceApp />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
